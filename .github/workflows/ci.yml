name: Canonical Runtime CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .dstream-work
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .dstream-work/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Mobile shell checks
        run: npm run check:mobile

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          {
            echo "DSTREAM_XMR_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "DSTREAM_PLAYBACK_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "DSTREAM_XMR_WALLET_RPC_USER=ci"
            echo "DSTREAM_XMR_WALLET_RPC_PASS=$(openssl rand -hex 32)"
            echo "TURN_SHARED_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Hardening preflight
        env:
          NEXT_PUBLIC_NOSTR_RELAYS: wss://relay.damus.io,wss://nos.lol
          NEXT_PUBLIC_WEBRTC_STUN_SERVERS: stun:stun.cloudflare.com:3478
          DSTREAM_TURN_URLS: turn:turn.example.com:3478?transport=udp
          DSTREAM_WHIP_PROXY_ORIGIN: http://localhost:8889
          DSTREAM_HLS_PROXY_ORIGIN: http://localhost:8888
          DSTREAM_XMR_WALLET_RPC_ORIGIN: http://localhost:18083
        run: npm run harden:check

      - name: Build
        run: npm run build
